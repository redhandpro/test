<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ورود مدیر — Coffee IIIZ</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>
  <main class="login-root">
    <div class="card">
      <h1>ورود مدیر</h1>
      <p class="muted">فقط مدیر مجاز است — ایمیل: <b>www.izzcafe@gmail.com</b></p>

      <label>ایمیل</label>
      <input id="email" type="email" placeholder="ایمیل مدیر" value="www.izzcafe@gmail.com" />

      <label>رمز عبور</label>
      <input id="password" type="password" placeholder="رمز عبور" />

      <button id="loginBtn">ورود</button>
      <p id="msg" class="msg"></p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const msgEl = document.getElementById('msg');
    const loginBtn = document.getElementById('loginBtn');

    loginBtn.addEventListener('click', async () => {
      msgEl.textContent = '';
      try {
        const email = emailEl.value.trim();
        const pass = passEl.value;
        if (!email || !pass) { msgEl.textContent = 'ایمیل و رمز را وارد کنید.'; return; }

        const userCred = await signInWithEmailAndPassword(auth, email, pass);
        // فقط اجازه برای ایمیل مدیر داده شده است — در صورت نیاز بازبینی کنید
        if (userCred.user && userCred.user.email.toLowerCase() === 'www.izzcafe@gmail.com') {
          window.location.href = 'admin-panel.html';
        } else {
          msgEl.textContent = 'دسترسی غیرمجاز';
          await auth.signOut();
        }
      } catch (e) {
        msgEl.textContent = 'خطا در ورود: ' + (e.message || e.code);
      }
    });
  </script>
</body>
</html>
