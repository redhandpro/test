<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>پنل مدیریت — Coffee IIIZ</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <img src="https://avatars.githubusercontent.com/u/9919?s=200&v=4" alt="logo">
        <div>
          <h2>Coffee IIIZ — پنل مدیریت</h2>
          <div class="muted">ایمیل مدیر: <b>www.izzcafe@gmail.com</b></div>
        </div>
      </div>

      <div class="controls">
        <button id="logoutBtn" class="btn-small btn-ghost">خروج</button>
      </div>
    </div>

    <div class="panel">
      <h3>افزودن آیتم جدید</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <input id="newName" placeholder="نام آیتم" />
        <input id="newPrice" placeholder="قیمت (تومان)" type="number" />
        <input id="newImage" placeholder="آدرس عکس (اختیاری)" />
        <button id="addBtn" class="btn-small">افزودن</button>
      </div>

      <div style="margin-top:18px;">
        <h3>لیست آیتم‌ها</h3>
        <div id="menuGrid" class="grid"></div>
      </div>

      <p class="footer-note">توجه: فقط کاربر با ایمیل مدیر مجاز به ویرایش است.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // elements
    const newName = document.getElementById('newName');
    const newPrice = document.getElementById('newPrice');
    const newImage = document.getElementById('newImage');
    const addBtn = document.getElementById('addBtn');
    const menuGrid = document.getElementById('menuGrid');
    const logoutBtn = document.getElementById('logoutBtn');

    // protect: check current user (assumes login already done via admin-login.html)
    auth.onAuthStateChanged(user => {
      if (!user) {
        // redirect to login if not authed
        window.location.href = 'admin-login.html';
      } else {
        // optional check: if not admin email, sign out
        if (user.email.toLowerCase() !== 'www.izzcafe@gmail.com') {
          alert('دسترسی غیرمجاز.');
          signOut(auth);
        } else {
          // load menu live
          loadLiveMenu();
        }
      }
    });

    // add
    addBtn.addEventListener('click', async () => {
      const name = newName.value.trim();
      const price = Number(newPrice.value);
      const image = newImage.value.trim() || null;
      if (!name || !price) { alert('نام و قیمت را وارد کنید'); return; }
      await addDoc(collection(db, 'menu'), { name, price, image, createdAt: Date.now() });
      newName.value = ''; newPrice.value=''; newImage.value='';
    });

    // live listener
    function loadLiveMenu() {
      const q = query(collection(db, 'menu'), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snapshot) => {
        menuGrid.innerHTML = '';
        snapshot.forEach(docSnap => {
          const id = docSnap.id;
          const data = docSnap.data();
          const item = document.createElement('div');
          item.className = 'card-item';
          item.innerHTML = `
            <div class="title">${data.name}</div>
            <div class="price">${data.price} تومان</div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
              <input id="p-${id}" type="number" placeholder="قیمت جدید" />
              <button class="btn-small btn-edit" data-id="${id}">ذخیره</button>
              <button class="btn-small btn-del" data-id="${id}">حذف</button>
            </div>
            ${data.image ? `<img src="${data.image}" alt="${data.name}" style="width:100%;border-radius:8px;margin-top:8px;">` : ''}
          `;
          menuGrid.appendChild(item);
        });

        // attach events (delegate)
        menuGrid.querySelectorAll('.btn-edit').forEach(btn => {
          btn.onclick = async (e) => {
            const id = e.currentTarget.dataset.id;
            const val = Number(document.getElementById('p-'+id).value);
            if (!val) { alert('قیمت جدید را وارد کنید'); return; }
            await updateDoc(doc(db, 'menu', id), { price: val });
          };
        });
        menuGrid.querySelectorAll('.btn-del').forEach(btn => {
          btn.onclick = async (e) => {
            const id = e.currentTarget.dataset.id;
            if (!confirm('مطمئنی حذف شود؟')) return;
            await deleteDoc(doc(db, 'menu', id));
          };
        });
      });
    }

    logoutBtn.onclick = async () => {
      await signOut(auth);
      window.location.href = 'admin-login.html';
    };
  </script>
</body>
</html>
