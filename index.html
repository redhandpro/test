<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منوی کافه</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f5f2;
      color: #333;
      line-height: 1.7;
    }
    header {
      background: #2f2f2f;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 1.6rem;
    }
    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }
    .category {
      margin-bottom: 40px;
    }
    .category h2 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    .item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .item-name {
      font-weight: bold;
    }
    .price {
      color: #444;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>منوی دیجیتال کافه</header>

  <div class="container">

    <div class="category">
      <h2>نوشیدنی‌های گرم</h2>
      <div class="item"><span class="item-name">قهوه دمی</span><span class="price">75,000</span></div>
      <div class="item"><span class="item-name">کاپوچینو</span><span class="price">85,000</span></div>
      <div class="item"><span class="item-name">لاته</span><span class="price">80,000</span></div>
    </div>

    <div class="category">
      <h2>نوشیدنی‌های سرد</h2>
      <div class="item"><span class="item-name">آیس لاته</span><span class="price">90,000</span></div>
      <div class="item"><span class="item-name">فرپه کارامل</span><span class="price">110,000</span></div>
    </div>

    <div class="category">
      <h2>دسر و میان‌وعده</h2>
      <div class="item"><span class="item-name">چیزکیک</span><span class="price">95,000</span></div>
      <div class="item"><span class="item-name">براونی</span><span class="price">70,000</span></div>
    </div>

  </div>

  <footer>© 2025 کافه شما — نسخه دیجیتالی</footer>
</body>
</html>
