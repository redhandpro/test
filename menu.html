<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه IIIZ</title>

    <!-- فونت و آیکون -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- فایل استایل اصلی -->
    <link rel="stylesheet" href="style.css">

    <style>
        .menu-page {
            text-align: center;
            padding-top: 120px;
            color: white;
        }

        .menu-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #9d00ff, #00e5ff);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(157, 0, 255, .5);
        }

        .menu-box {
            width: 90%;
            max-width: 450px;
            margin: auto;
            background: rgba(20,20,40,0.6);
            border: 1px solid rgba(157, 0, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .back-btn {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(45deg, #9d00ff, #00e5ff);
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-family: "Orbitron";
            transition: .3s;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

<div class="cosmos-background">
    <div class="stars-container"></div>
</div>

<div class="menu-page">
    <h1 class="menu-title">منوی کافه IIIZ ☕🚀</h1>

    <div class="menu-box">
        <div class="menu-item"><span>لاته</span> <span>65,000 تومان</span></div>
        <div class="menu-item"><span>کاپوچینو</span> <span>60,000 تومان</span></div>
        <div class="menu-item"><span>آیس آمریکانو</span> <span>55,000 تومان</span></div>
        <div class="menu-item"><span>موکا</span> <span>70,000 تومان</span></div>
        <div class="menu-item"><span>چای ماسالا</span> <span>58,000 تومان</span></div>
        <div class="menu-item"><span>شیک کاراملی</span> <span>75,000 تومان</span></div>
    </div>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> بازگشت</a>
</div>

</body>
</html>
